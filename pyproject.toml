[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmedallion"
version = "2026.8.2"
description = "Declarative medallion pipelines in pure open-source Python — local first, cloud portable, fast by default."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "data engineering",
    "etl",
    "elt",
    "medallion",
    "pipeline",
    "polars",
    "dlt",
    "hamilton",
    "data lakehouse",
    "bronze silver gold",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "dlt[filesystem,sql_database,parquet]>=1.4",
    "sf-hamilton>=1.82",
    "polars>=1.0",
    "pyyaml>=6.0",
    "setuptools>=70.0,<=81.0",
    "tqdm>=4.67.3",
    "duckdb>=0.10",
    "pydantic>=2.0"
]

[project.optional-dependencies]
s3       = ["s3fs>=2024.1", "boto3>=1.34"]
oracle   = ["oracledb>=1.0"]
profile  = ["ydata-profiling>=4.0"]
explore  = ["pygwalker>=0.4"]
cerebrum = [
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "chromadb>=0.5",
]
cortex   = [
    "dash>=2.17",
    "dash-bootstrap-components>=1.6",
    "plotly>=5.22",
    "httpx>=0.27",
    "pandas>=2.0",
    "xlsxwriter>=3.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage      = "https://github.com/tummala-hareesh/openmedallion"
Repository    = "https://github.com/tummala-hareesh/openmedallion"
Documentation = "https://tummala-hareesh.github.io/openmedallion/"
"Bug Tracker" = "https://github.com/tummala-hareesh/openmedallion/issues"
Changelog     = "https://github.com/tummala-hareesh/openmedallion/blob/main/CHANGELOG.md"

[project.scripts]
medallion = "openmedallion.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["openmedallion"]

[tool.hatch.build.targets.sdist]
include = [
    "openmedallion/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "duckdb>=0.10",
    "fastapi>=0.111",
    "httpx[test]>=0.27",
    "pytest>=8",
    "pytest-anyio>=0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
