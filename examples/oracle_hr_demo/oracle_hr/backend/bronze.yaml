sources:
  - type: sql_database

    # ── Connection ───────────────────────────────────────────────────────────
    # DEMO (SQLite — no credentials needed, path is set here directly):
    dialect:           sqlite
    connection_string: "sqlite:///oracle_hr/data/source/oracle_hr.db"

    # REAL DATABASE — comment out the two lines above and uncomment below,
    # then fill in examples/secrets.yaml with your credentials:
    # dialect:          oracle       # or postgres, mysql, mssql
    # credentials_file: ../secrets.yaml

    tables:
      # ── employees ───────────────────────────────────────────────────────────
      # filter: push a SQL WHERE clause so that only employees in the five target
      #   departments are loaded into bronze.  Rows in dept 30 (Purchasing) and
      #   50 (Shipping) are excluded at source — they never enter the data lake.
      # select: drop email (PII).
      #   hire_date must be included — it is the incremental cursor column.
      - name: employees
        select: [employee_id, first_name, last_name, hire_date, job_id, salary, manager_id, department_id]
        filter: "department_id IN (10, 20, 60, 80, 90)"
        incremental:
          mode: append
          cursor_column: hire_date
          initial_value: "2000-01-01"
        explore:
          - report_type: profile
            output_file:  employees_profile.html
            title:        "Employees Bronze Quality"

      # ── departments ─────────────────────────────────────────────────────────
      # select: only the columns used in the silver join and gold aggregations.
      # filter_propagate is validated at config-load time (Pydantic ProjectConfig
      # schema): 'employees' must exist and have a 'filter' set, checked before
      # any DB connection is attempted.
      - name: departments
        select: [department_id, department_name]
        filter_propagate: employees
        incremental:
          mode: merge
          primary_key: department_id
        explore:
          - report_type: profile
            output_file:  departments_profile.html
            title:        "Departments Bronze Quality"

      # ── jobs ────────────────────────────────────────────────────────────────
      - name: jobs
        select: [job_id, job_title, min_salary, max_salary]
        incremental:
          mode: merge
          primary_key: job_id
        explore:
          - report_type: profile
            output_file:  jobs_profile.html
            title:        "Jobs Bronze Quality"

    destination:
      type: filesystem
      # dlt appends /bronze/<table>/ automatically; bronze.py merges shards into
      # oracle_hr/data/bronze/<table>.parquet  (paths.bronze = oracle_hr/data/bronze)
      bucket_url: "data"
