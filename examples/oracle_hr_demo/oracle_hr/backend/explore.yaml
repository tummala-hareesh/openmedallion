gold_to_explore:
  projects:
    - name: oracle_hr
      tables:
        # ── Statistical profile reports (ydata-profiling) ─────────────────────
        - source_file: headcount_by_department.parquet
          report_type:  profile
          output_file:  headcount_profile.html
          title:        "Headcount & Payroll by Department"

        - source_file: salary_by_job.parquet
          report_type:  profile
          output_file:  salary_by_job_profile.html
          title:        "Salary Analysis by Job Title"

        # ── Interactive drag-and-drop explorer (pygwalker) ────────────────────
        - source_file: salary_utilization.parquet
          report_type:  walker
          output_file:  salary_utilization_explorer.html
          title:        "Salary Utilization Explorer"
