sources:
  - type: sql_database

    # ── Connection ───────────────────────────────────────────────────────────
    # DEMO (SQLite — no credentials needed, path is set here directly):
    dialect:           sqlite
    connection_string: "sqlite:///data/retail.db"

    # REAL DATABASE — comment out the two lines above and uncomment below,
    # then fill in examples/secrets.yaml with your credentials:
    # dialect:          postgres      # or oracle, mysql, mssql
    # credentials_file: ../secrets.yaml

    tables:
      # Append mode: only rows newer than the last cursor value are loaded.
      # Re-running picks up only new orders.
      - name: orders
        select: [order_id, customer_id, amount, created_at]
        incremental:
          mode: append
          cursor_column: created_at
          initial_value: "2024-01-01"
        explore:
          - report_type: profile
            output_file:  orders_profile.html
            title:        "Orders Bronze Quality"

      # Merge mode: upserts on primary key.
      # Re-running overwrites changed customer rows in-place.
      # select: drop the email column — PII not needed downstream.
      - name: customers
        select: [customer_id, name, tier]
        incremental:
          mode: merge
          primary_key: customer_id
        explore:
          - report_type: profile
            output_file:  customers_profile.html
            title:        "Customers Bronze Quality"

    destination:
      type: filesystem
      # dlt appends /<dataset_name>/<table>/ to bucket_url automatically.
      # dataset_name is hardcoded as "bronze" in bronze.py, so shards land at:
      #   data/bronze/<table>/*.parquet
      # bronze.py merges shards into data/bronze/<table>.parquet (paths.bronze = "data/bronze")
      bucket_url: "data"
