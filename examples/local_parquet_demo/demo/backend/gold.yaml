silver_to_gold:
  projects:
    - name: demo
      aggregations:
        - source_file: orders.parquet
          group_by: [customer_id, customer_name]
          metrics:
            - {column: order_id, agg: count, alias: total_orders}
            - {column: amount,   agg: sum,   alias: total_spent}
          output_file: orders_by_customer.parquet
          explore:
            - report_type: profile
              output_file:  orders_by_customer_profile.html
              title:        "Orders by Customer"
            - report_type: walker
              output_file:  orders_by_customer_explorer.html
              title:        "Orders by Customer Explorer"

        - source_file: orders.parquet
          group_by: [status]
          metrics:
            - {column: order_id, agg: count, alias: num_orders}
            - {column: amount,   agg: sum,   alias: total_amount}
          output_file: orders_by_status.parquet
          explore:
            - report_type: profile
              output_file:  orders_by_status_profile.html
              title:        "Orders by Status"
            - report_type: walker
              output_file:  orders_by_status_explorer.html
              title:        "Orders by Status Explorer"
