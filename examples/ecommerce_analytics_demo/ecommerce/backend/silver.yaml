bronze_to_silver:
  tables:
    - source_file: orders.parquet
      output_file: orders.parquet
      explore:
        - report_type: profile
          output_file:  orders_profile.html
          title:        "Orders Silver Quality"
      transforms:
        - type: cast
          columns:
            order_id:    Int64
            product_id:  Int64
            customer_id: Int64
            qty:         Int64

    - source_file: products.parquet
      output_file: products.parquet
      explore:
        - report_type: profile
          output_file:  products_profile.html
          title:        "Products Silver Quality"
      transforms:
        - type: cast
          columns:
            product_id: Int64
            unit_price: Float64
            unit_cost:  Float64

    - source_file: customers.parquet
      output_file: customers.parquet
      explore:
        - report_type: profile
          output_file:  customers_profile.html
          title:        "Customers Silver Quality"
      transforms:
        - type: cast
          columns:
            customer_id: Int64

  derived_tables:
    - output_file: order_lines_enriched.parquet
      udf:
        file: ecommerce/backend/udf/silver/enrich.py
        function: build_order_lines_enriched
      explore:
        - report_type: profile
          output_file:  order_lines_enriched_profile.html
          title:        "Order Lines Enriched Quality"
        # - report_type: walker
        #   output_file:  order_lines_enriched_explorer.html
        #   title:        "Order Lines Enriched Explorer"
